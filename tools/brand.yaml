# file: tools/brand.yaml

vars:
  APP_NAME:
    default: Bfw PWA

  APP_ID:
    default: com.thatsend.bfwpwa

platforms:
  android:
    appName: $APP_NAME

    xml:
      - resFile: values/strings.xml
        target: resources/string[@name="app_name"]
        replace: |
          <string name="app_name">$APP_NAME</string>

      - resFile: values/strings.xml
        target: resources/string[@name="title_activity_main"]
        replace: |
          <string name="title_activity_main">$APP_NAME</string>

      - resFile: values/strings.xml
        target: resources/string[@name="package_name"]
        replace: |
          <string name="package_name">$APP_ID</string>

      - resFile: values/strings.xml
        target: resources/string[@name="custom_url_scheme"]
        replace: |
          <string name="custom_url_scheme">$APP_ID</string>

  ios:
    targets:
      App:
        displayName: $APP_NAME
        productName: $APP_NAME

        plist:
          - replace: false
            entries:
              - CFBundleDisplayName: $APP_NAME
              - CFBundleName: $APP_NAME