    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; height: 100vh; background: #1a1a1a; color: #fff; }
        
        /* Sidebar layout */
        #sidebar { width: 300px; background: #262626; border-right: 1px solid #3d3d3d; display: flex; flex-direction: column; }
        #sidebar h2 { padding: 15px; font-size: 16px; border-bottom: 1px solid #3d3d3d; background: #2e2e2e; }
        #part-list { flex: 1; overflow-y: auto; list-style: none; }
        #part-list li { padding: 10px 15px; font-size: 13px; cursor: pointer; border-bottom: 1px solid #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background 0.2s; }
        #part-list li:hover { background: #3d3d3d; }
        
        /* Fixed Sidebar Active: Swapped Red out for a Clean High-Contrast White State */
        #part-list li.active { background: #ffffff; color: #000000; font-weight: bold; }

        /* Main canvas viewport */
        #viewport { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; overflow: auto; position: relative; }
        canvas { background-image: linear-gradient(45deg, #333 25%, transparent 25%), linear-gradient(-45deg, #333 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #333 75%), linear-gradient(-45deg, transparent 75%, #333 75%); background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px; border: 2px solid #444; max-width: 100%; max-height: 100%; object-fit: contain; }
    </style>
</head>

	"size": {"w":3605,"h":4121},
	"scale": "1",
	"smartupdate": "$TexturePacker:SmartUpdate:0be977a82e38f317b44eb11ecec41b4c:d80df8f1b2e2ccdbce03dbf3d44a2ecf:e0a22393490014835f0eb1c2bffda2e2$"

        const ATLAS_IMAGE_URL = 'assets/game/tiles/2x/Tiles_2x.png'; 

        // DOM elements and Canvas setup
        const canvas = document.getElementById('atlasCanvas');
        const ctx = canvas.getContext('2d');
        const partListElement = document.getElementById('part-list');
        const countElement = document.getElementById('count');
        
        let img = new Image();
        let activePartKey = null;

        // Normalize different JSON structures down to a simple uniform key map
        function parseJsonFrames(json) {
            if (json.frames && !Array.isArray(json.frames)) return json.frames;
            if (json.frames && Array.isArray(json.frames)) {
                const map = {};
                json.frames.forEach(f => map[f.filename] = f);
                return map;
            }
            return json;
        }

        const frames = parseJsonFrames(atlasJson);

        // Render function
        function drawCanvas() {
            // Clear and draw base texture image
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0);

            // Draw bounding boxes for all unselected items (Semi-transparent white)
            Object.keys(frames).forEach(key => {
                const f = frames[key].frame || frames[key];
                
                // Draw a dark backing line first for visibility on white elements
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.lineWidth = 3;
                ctx.strokeRect(f.x, f.y, f.w || f.width, f.h || f.height);

                // Draw the clean thin white line on top
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.lineWidth = 1;
                ctx.strokeRect(f.x, f.y, f.w || f.width, f.h || f.height);
            });

            // Highlight the currently selected item vividly in SOLID WHITE with a black shadow
            if (activePartKey && frames[activePartKey]) {
                const active = frames[activePartKey].frame || frames[activePartKey];
                const ax = active.x;
                const ay = active.y;
                const aw = active.w || active.width;
                const ah = active.h || active.height;

                // Translucent white fill overlay (illuminates the slice area)
                ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.fillRect(ax, ay, aw, ah);

                // STEP 1: Outer thick black stroke border shadow (visible against pure white sprites)
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 6;
                ctx.strokeRect(ax, ay, aw, ah);

                // STEP 2: Inner solid crisp white border core (visible against pure black grids)
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3;
                ctx.strokeRect(ax, ay, aw, ah);
            }
        }

        // Initialize UI list panel
        function initUI() {
            const keys = Object.keys(frames);
            countElement.textContent = keys.length;

            keys.forEach(key => {
                const li = document.createElement('li');
                li.textContent = key;
                li.addEventListener('click', () => {
                    // Update active classes
                    document.querySelectorAll('#part-list li').forEach(el => el.classList.remove('active'));
                    li.classList.add('active');
                    
                    // Track selection and refresh frame render
                    activePartKey = key;
                    drawCanvas();
                });
                partListElement.appendChild(li);
            });
        }

        // Load asset workflow
        img.onload = function() {
            canvas.width = img.width;
            canvas.height = img.height;
            initUI();
            drawCanvas();
        };
        img.src = ATLAS_IMAGE_URL;
