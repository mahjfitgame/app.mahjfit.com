<div class="bfw-pagination-container tw:flex tw:items-center tw:w-full tw:justify-end tw:max-md:justify-center">
  <div class="bfw-pagination-inline tw:inline-flex tw:items-center tw:flex-wrap tw:gap-2
              tw:max-md:flex tw:max-md:w-full tw:max-md:flex-col tw:max-md:justify-center tw:max-md:gap-3
              tw:rtl:flex-row-reverse">
    <mat-paginator
      [length]="totalRecords()"
      [pageIndex]="currentMatPageIndex"
      [pageSize]="currentPageSize"
      [pageSizeOptions]="pageSizeOptions()"
      [showFirstLastButtons]="showFirstLastButtons()"
      [hidePageSize]="hidePageSize()"
      [disabled]="disabled()"
      (page)="onPaginatorChange($event)">
    </mat-paginator>

    @if (showJumpToPage()) {
      <div class="bfw-jump-container tw:inline-flex tw:items-center tw:gap-2 tw:rtl:flex-row-reverse">
        <mat-form-field
          appearance="outline"
          subscriptSizing="dynamic"
          floatLabel="always"
          class="bfw-jump-field tw:w-30 tw:m-0">
          <mat-label>{{ pageLabel() }}</mat-label>
          <input
            matInput
            type="number"
            min="1"
            [max]="totalPages"
            [(ngModel)]="jumpPageNumber"
            [disabled]="disabled()"
            (keyup.enter)="goToPage()"
          />
        </mat-form-field>

        <span class="bfw-page-count tw:text-sm tw:whitespace-nowrap tw:text-(--mat-sys-on-surface-variant) tw:dark:text-white/50">{{ totalPagesText }}</span>

        <button
          mat-stroked-button
          color="primary"
          type="button"
          [disabled]="disabled()"
          (click)="goToPage()">
          {{ goLabel() }}
        </button>
      </div>
    }
  </div>
</div>
