<div class="tw:flex tw:items-center tw:justify-center tw:gap-3 tw:flex-wrap">
    <label class="tw:text-sm tw:font-medium tw:text-gray-700">
        {{ 'GL.LANGUAGE' | transloco }}
    </label>

    <select
        class="tw:min-w-36 tw:border tw:border-gray-300 tw:rounded-lg tw:px-3 tw:py-1.5 tw:bg-white tw:text-gray-900 tw:text-sm tw:shadow-sm focus:tw:outline-none focus:tw:border-indigo-500 focus:tw:ring-1 focus:tw:ring-indigo-500"
        [value]="service.currentLang()"
        (change)="changeLanguage($event)"
    >
        @for (lang of service.languages; track lang.code) {
            <option
                [value]="lang.code"
                [selected]="isActive(lang.code)"
            >
                {{ lang.nativeLabel }}
            </option>
        }
    </select>

    <div class="tw:flex tw:items-center tw:gap-2 tw:flex-wrap">
        @for (lang of service.languages; track lang.code) {
            <button
                type="button"
                class="tw:border tw:rounded-full tw:px-3 tw:py-1 tw:cursor-pointer tw:text-sm tw:transition-colors"
                [ngClass]="isActive(lang.code) ?
                    'tw:bg-primary tw:text-white tw:border-primary hover:tw:bg-primary-container' :
                    'tw:bg-white tw:text-gray-700 tw:border-gray-300 hover:tw:bg-gray-50'"
                (click)="service.use(lang.code)"
            >
                {{ lang.nativeLabel }}
            </button>
        }
    </div>
</div>
