<!-- file: ./src/app/base/crud/default/search-filter/template.html -->
 <button
    matIconButton
    type="button"
    [aria-label]="service.localText.search_filter.open_label"
    matTooltip=""
    matTooltipPosition="above"
    class="tw:rounded-full! tw:text-primary!"
    (click)="service.openSearchFilterForm()"
>
    <mat-icon class="material-symbols-rounded">filter_alt</mat-icon>
</button>

<!-- End sidebar Tab Extension for Search Filter -->
<ng-template cdkPortal [privateAreaLayout]="service.PrivateAreaLayoutSlotEnum.SLOT_END_SIDE_BAR_TAB_LABEL" [privateAreaLayoutIndex]="0" [privateAreaLayoutLabel]="service.CrudEndSideBarTabEnum.FILTER">
    <span>{{ service.localText.search_filter.tab_name }}</span>
</ng-template>
<ng-template cdkPortal [privateAreaLayout]="service.PrivateAreaLayoutSlotEnum.SLOT_END_SIDE_BAR_TAB_BODY" [privateAreaLayoutIndex]="0" [privateAreaLayoutLabel]="service.CrudEndSideBarTabEnum.FILTER">
    <div class="bfw-safe-area-pe">
        <div class="tw:flex tw:flex-col tw:min-w-0 tw:gap-4 tw:p-3">
            <form id="crudSearchFilterForm" (submit)="$event.preventDefault(); service.submitSearchFilterForm()" novalidate>
                <app-crud-default-form-field 
                    [fieldObj]="[service.state.viewOptionFieldObj(), service.state.searchFilterFieldObj()]"
                    [slotPrefix]="service.CrudFieldSlotPortalKeyPrefixEnum.FILTER"
                >
                </app-crud-default-form-field>
            </form>
        </div>
    </div>
    <footer class="bfw-safe-area-pb bfw-safe-area-pe tw:sticky tw:bottom-0 tw:z-20 tw:w-full tw:backdrop-blur-md tw:mbs-auto">
        <div class="tw:flex tw:gap-2 tw:p-3!">
            <button mat-button  type="reset" form="crudSearchFilterForm" class="tw:flex-1">Reset</button>
            <button mat-flat-button type="submit" form="crudSearchFilterForm" color="primary" class="tw:flex-1">Apply</button>
        </div>
    </footer>
</ng-template>
