@let fullscreen = service.state.view.viewActionUiSize() === service.UiSizeEnum.FULL;

<div class="tw:flex tw:flex-col tw:overflow-y-auto tw:z-20" [class]="fullscreen ? 'tw:h-full' : 'tw:max-h-[90dvh]'">
    <mat-toolbar class="tw:sticky tw:top-0 tw:z-20 tw:w-full tw:shrink-0 tw:bg-transparent! tw:backdrop-blur-md tw:p-3!">
        <div class="tw:flex tw:w-full tw:items-center tw:justify-between tw:py-3">
            <h2 class="tw:m-0 tw:flex tw:items-center tw:gap-2 tw:text-xl! tw:font-semibold">
                <mat-icon class="material-symbols-rounded">{{ service.getViewIcon() }}</mat-icon>
                {{ service.getViewTitle() | transloco }}
            </h2>
            <div class="tw:flex tw:items-center">
                @if (service.state.action.hasPrint()) {
                    <button
                        mat-icon-button
                        type="button"
                        (click)="service.printRecord()"
                        [attr.aria-label]="'GL.ACTION.PRINT' | transloco"
                    >
                        <mat-icon class="material-symbols-rounded">print</mat-icon>
                    </button>
                }
                <button mat-icon-button type="button" (click)="service.closeViewAction()" [attr.aria-label]="'GL.COMMON.CLOSE' | transloco">
                    <mat-icon class="material-symbols-rounded">close</mat-icon>
                </button>
            </div>
        </div>
    </mat-toolbar>
    <main class="bfw-safe-area-px bfw-safe-area-py tw:min-h-0">
        <div class="tw:flex tw:min-w-0 tw:flex-col tw:gap-4 tw:p-3">
            <ng-container *ngComponentOutlet="service.getViewRecordComponent(); injector: service.getComponentInjector()"></ng-container>
        </div>
    </main>
</div>
