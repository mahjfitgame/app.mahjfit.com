<!-- file: src/app/base/crud/default/listing/record-action/template.html -->
 <button mat-icon-button [matMenuTriggerFor]="menu" [attr.aria-label]="'GL.COMMON.ACTIONS_MENU' | transloco">
    <mat-icon class="material-symbols-rounded">more_vert</mat-icon>
</button>
<mat-menu #menu="matMenu" xPosition="before">
    <a
        mat-menu-item
        [routerLink]="service.url.getUpdateActionUrlBySecondaryKey(service.state.getRecordSecondaryKeyValue(row()))"
        [state]="service.url.getCrudActionNavigationState()"
    >
        <mat-icon class="material-symbols-rounded">edit</mat-icon>
        <span>{{ 'GL.ACTION.UPDATE' | transloco }}</span>
    </a>
    <button mat-menu-item click="">
        <mat-icon class="material-symbols-rounded">block</mat-icon>
        <span>Ban</span>
    </button>
    <button mat-menu-item click="">
        <mat-icon class="material-symbols-rounded">delete</mat-icon>
        <span>{{ 'GL.ACTION.DELETE' | transloco }}</span>
    </button>
</mat-menu>
