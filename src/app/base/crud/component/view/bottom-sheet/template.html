<!-- file: src/app/base/crud/default/view/bottom-sheet/template.html -->
<div class="bfw-safe-area-px tw:flex tw:max-h-[80vh] tw:flex-col tw:overflow-scroll tw:z-20">
    <mat-toolbar class="tw:flex tw:sticky tw:top-0 tw:z-20 tw:w-full tw:bg-transparent! tw:backdrop-blur-md tw:p-3!">
        <div class="tw:flex tw:w-full tw:items-center tw:justify-between tw:gap-3">
            <div class="tw:flex tw:items-center tw:gap-3 tw:min-w-0">
                <mat-icon class="material-symbols-rounded tw:shrink-0">{{ service.view.getViewIcon() }}</mat-icon>
                <div class="tw:min-w-0">
                    <h2 class="tw:text-xl! tw:font-semibold tw:m-0 tw:leading-tight tw:truncate">
                        {{ service.view.getViewTitle() | transloco }}
                    </h2>
                    @if (service.state.getRecordLabelFieldValue(service.state.actionListingRecord()); as label) {
                        <p class="tw:text-sm tw:font-normal tw:m-0 tw:leading-tight tw:opacity-70 tw:truncate">{{ label }}</p>
                    }
                </div>
            </div>
            <div class="tw:flex tw:gap-2 tw:items-center tw:shrink-0">
                @if (service.state.action.hasPrint()) {
                    <button
                        mat-icon-button
                        type="button"
                        (click)="service.view.printRecord(printArea)"
                        [disabled]="service.print.state.isPrinting()"
                        [attr.aria-label]="'GL.ACTION.PRINT' | transloco"
                    >
                        <mat-icon class="material-symbols-rounded">print</mat-icon>
                    </button>
                }
                <button mat-icon-button type="button" (click)="service.view.closeViewAction()" [attr.aria-label]="'GL.COMMON.CLOSE' | transloco">
                    <mat-icon class="material-symbols-rounded">close</mat-icon>
                </button>
            </div>
        </div>
    </mat-toolbar>
    <main class="bfw-safe-area-pb tw:min-h-0">
        <div #printArea class="tw:flex tw:min-w-0 tw:flex-col tw:gap-4 tw:p-3!">
            <ng-container 
                *ngComponentOutlet="service.view.getViewRecordComponent(); 
                injector: service.getComponentInjector()"
            ></ng-container>
        </div>
    </main>
</div>
