<ng-template
    cdkPortal
    [privateAreaLayout]="service.PrivateAreaLayoutSlotEnum.SLOT_MAIN_HEADER_TOOLBAR_EXTENSION"
>
    <div class="tw:flex tw:min-w-0 tw:items-center tw:gap-2">
        <div class="tw:flex tw:items-center tw:gap-2 tw:min-w-0">
            <mat-icon class="material-symbols-rounded tw:shrink-0">{{ service.view.getViewIcon() }}</mat-icon>
            <div class="tw:min-w-0 tw:leading-tight">
                <h1 class="tw:truncate tw:text-base tw:font-semibold tw:m-0 tw:leading-tight">
                    {{ service.view.getViewTitle() | transloco }}
                </h1>
                @if (service.state.getRecordLabelFieldValue(service.state.actionListingRecord()); as label) {
                    <p class="tw:truncate tw:text-xs tw:font-normal tw:m-0 tw:leading-tight tw:opacity-70">{{ label }}</p>
                }
            </div>
        </div>

        <mat-divider [vertical]="true" class="tw:mx-1 tw:h-6!"></mat-divider>

        <div class="tw:flex tw:gap-2 tw:items-center">
        @if (service.state.action.hasPrint()) {
            <button
                mat-icon-button
                type="button"
                class="tw:flex! tw:items-center! tw:justify-center!"
                (click)="service.view.printRecord(printArea)"
                [disabled]="service.print.state.isPrinting()"
                [attr.aria-label]="'GL.ACTION.PRINT' | transloco"
            >
                <mat-icon class="material-symbols-rounded">print</mat-icon>
            </button>
        }
        <button mat-icon-button type="button" class="tw:flex! tw:items-center! tw:justify-center!" (click)="service.view.closeViewAction()" [attr.aria-label]="'GL.COMMON.BACK' | transloco">
            <mat-icon class="material-symbols-rounded">close</mat-icon>
        </button>
        </div>
    </div>
</ng-template>

<section class="tw:flex tw:min-h-full tw:flex-col">
    <main #printArea class="tw:min-h-0 tw:flex-1 tw:p-4">
        <ng-container
            *ngComponentOutlet="
                service.view.getViewRecordComponent(); 
                injector: service.getComponentInjector()
            ">
        </ng-container>
    </main>
</section>
