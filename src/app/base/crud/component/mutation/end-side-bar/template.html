<!-- file: src/app/base/crud/default/mutation/end-side-bar/template.html -->

<!--
To open this side bar need to make a call to
service.paLayout.toogleEndSideBarAndSwitchTab('crud-mutation')
-->

<!-- End sidebar Tab Extension for Mutation Form -->
<ng-template cdkPortal 
    [privateAreaLayout]="service.PrivateAreaLayoutSlotEnum.SLOT_END_SIDE_BAR_TAB_LABEL" 
    [privateAreaLayoutIndex]="1" 
    [privateAreaLayoutLabel]="service.CrudEndSideBarTabEnum.MUTATION"
>
    <span>{{ service.mutation.getMutationTitle() | transloco }}</span>
</ng-template>
<ng-template cdkPortal 
    [privateAreaLayout]="service.PrivateAreaLayoutSlotEnum.SLOT_END_SIDE_BAR_TAB_BODY" 
    [privateAreaLayoutIndex]="1" 
    [privateAreaLayoutLabel]="service.CrudEndSideBarTabEnum.MUTATION"
>
    <div class="bfw-safe-area-pe">
        @if (service.state.getRecordLabelFieldValue(service.state.actionListingRecord()); as label) {
        <div class="tw:flex tw:items-center tw:gap-3 tw:min-w-0 tw:p-3 tw:pb-0">
            <mat-icon class="material-symbols-rounded tw:shrink-0">{{ service.mutation.getMutationIcon() }}</mat-icon>
            <div class="tw:min-w-0">
                <h2 class="tw:text-base! tw:font-semibold tw:m-0 tw:leading-tight tw:truncate">
                    {{ label }}
                </h2>
            </div>
        </div>
        }
        <div class="tw:flex tw:flex-col tw:min-w-0 tw:gap-4 tw:p-3">
            <ng-container *ngComponentOutlet="service.mutation.getMutationFormComponent(); injector: service.getComponentInjector()"></ng-container>
        </div>
    </div>
    <footer class="bfw-safe-area-pb bfw-safe-area-pe tw:sticky tw:bottom-0 tw:z-20 tw:w-full tw:backdrop-blur-md tw:mbs-auto">
        <div class="tw:flex tw:gap-2 tw:p-3!">
            <button mat-button type="button" class="tw:flex-1" [disabled]="service.state.mutation.mutationFormProcessing() || service.state.mutation.mutationForm().submitting()" (click)="service.state.mutation.resetMutationForm()">
                {{ 'GL.COMMON.RESET' | transloco }}
            </button>
            <button mat-flat-button type="submit" form="crudMutationForm" color="primary" class="tw:flex-1" [disabled]="service.state.mutation.mutationFormProcessing() || service.state.mutation.mutationForm().invalid() || service.state.mutation.mutationForm().pending() || service.state.mutation.mutationForm().submitting()">
                {{ 'GL.COMMON.SAVE' | transloco }}
            </button>
            <!-- <button mat-button type="button" aria-label="Close form" (click)="service.mutation.closeMutationAction()">
                <mat-icon class="material-symbols-rounded tw:m-0!">close</mat-icon>
            </button> -->
        </div>
    </footer>
</ng-template>
