<!-- file: src/app/base/crud/default/mutation/page/template.html -->
<ng-template
    cdkPortal
    [privateAreaLayout]="service.PrivateAreaLayoutSlotEnum.SLOT_MAIN_HEADER_TOOLBAR_EXTENSION"
>
    <div class="tw:flex tw:min-w-0 tw:items-center tw:gap-2">
        <mat-icon class="material-symbols-rounded tw:shrink-0">{{ service.mutation.getMutationIcon() }}</mat-icon>
        <div class="tw:min-w-0 tw:leading-tight">
            <h1 class="tw:truncate tw:text-base tw:font-semibold tw:m-0 tw:leading-tight">
                {{ service.mutation.getMutationTitle() | transloco }}
            </h1>
            @if (service.state.getRecordLabelFieldValue(service.state.actionListingRecord()); as label) {
                <p class="tw:truncate tw:text-xs tw:font-normal tw:m-0 tw:leading-tight tw:opacity-70">{{ label }}</p>
            }
        </div>

        <mat-divider [vertical]="true" class="tw:mx-1 tw:h-6!"></mat-divider>

        <button mat-icon-button type="button" class="tw:flex! tw:items-center! tw:justify-center!" [attr.aria-label]="'GL.COMMON.BACK' | transloco" (click)="service.action.closeCrudAction()">
            <mat-icon class="material-symbols-rounded">close</mat-icon>
        </button>
    </div>
</ng-template>

<section class="tw:flex tw:min-h-full tw:flex-col">
    <main class="tw:flex-1 tw:p-4">
        <ng-container
            *ngComponentOutlet="
                service.mutation.getMutationFormComponent();
                injector: service.getComponentInjector()
            "
        ></ng-container>
    </main>

    <footer class="tw:flex tw:gap-3 tw:p-4">
        <button mat-button type="button" class="tw:flex-1" [disabled]="service.state.mutation.mutationFormProcessing() || service.state.mutation.mutationForm().submitting()" (click)="service.state.mutation.resetMutationForm()">
            {{ 'GL.COMMON.RESET' | transloco }}
        </button>

        <button mat-flat-button type="submit" form="crudMutationForm" color="primary" class="tw:flex-1" [disabled]="service.state.mutation.mutationFormProcessing() || service.state.mutation.mutationForm().invalid() || service.state.mutation.mutationForm().pending() || service.state.mutation.mutationForm().submitting()">
            {{ 'GL.COMMON.SAVE' | transloco }}
        </button>
    </footer>
</section>
