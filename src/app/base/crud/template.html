<!-- file: src/app/base/crud/template.html -->
<!-- module listing component, initial render -->
@if (service.shouldShowCrudListingLayout()) {
    <div class="tw:flex tw:flex-col tw:gap-4 tw:mx-2!">
        <app-crud-default-listing></app-crud-default-listing>
        <app-crud-default-pagination></app-crud-default-pagination>
    </div>

    <!-- Start sidebar extension -->
    <ng-template cdkPortal [privateAreaLayout]="service.PrivateAreaLayoutSlotEnum.SLOT_START_SIDE_BAR_EXTENSION">
    </ng-template>

    <!-- Main header toolbar extension -->
    <ng-template cdkPortal [privateAreaLayout]="service.PrivateAreaLayoutSlotEnum.SLOT_MAIN_HEADER_TOOLBAR_EXTENSION">
        <app-crud-default-quick-search></app-crud-default-quick-search>
        <app-crud-default-module-action></app-crud-default-module-action>
        <app-crud-default-search-filter></app-crud-default-search-filter>
    </ng-template>

    <!-- Main footer toolbar extension -->
    <ng-template cdkPortal [privateAreaLayout]="service.PrivateAreaLayoutSlotEnum.SLOT_MAIN_FOOTER_TOOLBAR_EXTENSION">
    </ng-template>

    <!-- End sidebar footer -->
    <ng-template cdkPortal [privateAreaLayout]="service.PrivateAreaLayoutSlotEnum.SLOT_END_SIDE_BAR_FOOTER">
    </ng-template>

    <!-- END SIDEBAR TAB EXTENSION (MULTIPLE TABS IF ANY) -->
    <!-- <ng-template data-tab="2" cdkPortal [privateAreaLayout]="service.PrivateAreaLayoutSlotEnum.SLOT_END_SIDE_BAR_TAB_LABEL">
        <span>TAB LABEL</span>
    </ng-template>
    <ng-template data-tab="2" cdkPortal [privateAreaLayout]="service.PrivateAreaLayoutSlotEnum.SLOT_END_SIDE_BAR_TAB_BODY">
        <div class="tw:p-1">
            TAB BODY
        </div>
    </ng-template> -->
}

<!-- module mutation action (create and update) form component -->
<app-crud-default-mutation></app-crud-default-mutation>
