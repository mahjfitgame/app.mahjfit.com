@let labelKey = service.state.displayLabelKey();

<mat-form-field appearance="outline" subscriptSizing="dynamic" class="tw:w-full">
  <mat-label>{{ label() }}</mat-label>

  @if (iconPrepend()) {
    <mat-icon matPrefix class="material-symbols-rounded">{{ iconPrepend() }}</mat-icon>
  }

  <div class="tw:relative tw:flex tw:items-center tw:gap-2">
    <input
      matInput
      readonly
      class="tw:min-w-0 tw:flex-1 tw:text-sm!"
      [errorStateMatcher]="errorMatcher"
      [ngModel]="labelKey ? (labelKey | transloco) : service.state.displayValue()"
      [ngModelOptions]="{ standalone: true }"
      [attr.name]="name()"
      [attr.id]="inputId() || name()"
      [required]="required()"
      [disabled]="disabled()"
    />

    @if (clearable() && !disabled() && service.state.hasDateTime()) {
      <button
        mat-icon-button
        type="button"
        class="tw:shrink-0 tw:h-8! tw:w-8! tw:p-1!"
        [attr.aria-label]="'GL.FIELD.COMMON.CLEAR' | transloco"
        (click)="service.onClear($event)"
      >
        <mat-icon class="material-symbols-rounded tw:h-6! tw:w-6!">close</mat-icon>
      </button>
    }

    <button
      mat-icon-button
      type="button"
      class="tw:shrink-0 tw:h-8! tw:w-8! tw:p-1!"
      [style.visibility]="service.state.isOn() ? 'visible' : 'hidden'"
      [disabled]="disabled() || !service.state.isOn()"
      [owlDateTimeTrigger]="FlagDateTimePicker"
      [attr.aria-label]="'GL.FIELD.DATETIME.SELECT' | transloco"
    >
      <mat-icon class="material-symbols-rounded tw:h-6! tw:w-6!">
        {{ service.state.modeConfig().triggerIcon }}
      </mat-icon>
    </button>

    <mat-slide-toggle
      class="tw:shrink-0"
      [checked]="service.state.isOn()"
      [required]="required()"
      [disabled]="disabled()"
      [attr.aria-label]="label()"
      (change)="service.onToggle($event.checked)"
    ></mat-slide-toggle>

    <!-- This must stay in layout so Owl anchors its overlay below the field. -->
    <input
      readonly
      tabindex="-1"
      aria-hidden="true"
      class="tw:absolute tw:inset-x-0 tw:bottom-0 tw:h-0 tw:w-full tw:opacity-0 tw:pointer-events-none tw:border-0 tw:p-0"
      [owlDateTime]="FlagDateTimePicker"
      [value]="service.pickerValue()"
      [min]="min()"
      [max]="max()"
      [disabled]="disabled()"
      (dateTimeChange)="service.onDateTimeChange($event.value)"
    />
  </div>

  @if (iconAppend()) {
    <mat-icon matSuffix class="material-symbols-rounded tw:mx-3">{{ iconAppend() }}</mat-icon>
  }

  <owl-date-time
    #FlagDateTimePicker
    [pickerType]="service.state.modeConfig().pickerType"
    [hour12Timer]="true"
    [showSecondsTimer]="true"
  ></owl-date-time>

  @if (error()) {
    <mat-error class="tw:flex! tw:items-center tw:gap-1">
      <mat-icon class="material-symbols-rounded tw:text-xs! tw:h-4! tw:w-4! tw:shrink-0"
        >error</mat-icon
      >
      <span>{{ error() }}</span>
    </mat-error>
  } @else if (hint()) {
    <mat-hint class="tw:flex tw:items-start tw:gap-1">
      <mat-icon class="material-symbols-rounded tw:text-xs! tw:h-4! tw:w-4! tw:shrink-0"
        >info</mat-icon
      >
      <span>{{ hint() }}</span>
    </mat-hint>
  }
</mat-form-field>
