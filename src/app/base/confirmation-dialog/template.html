<mat-toolbar class="tw:bg-transparent! tw:p-0! tw:h-auto! tw:whitespace-normal!">
    <div class="tw:flex tw:items-center tw:gap-3 tw:min-w-0 tw:w-full tw:px-6 tw:py-4">
        @if(data.icon) {
            <mat-icon class="material-symbols-rounded tw:shrink-0">
                {{ data.icon }}
            </mat-icon>
        }

        <div class="tw:min-w-0">
            <h2 mat-dialog-title
                class="tw:text-lg! tw:font-semibold tw:m-0! tw:p-0! tw:leading-tight tw:before:hidden! tw:wrap-break-word"
            >
                {{ data.titleKey | transloco: data.params }}
            </h2>
            @if (data.label) {
                <p class="tw:text-sm tw:font-normal tw:m-0 tw:mt-0.5 tw:leading-tight tw:opacity-70 tw:truncate">{{ data.label }}</p>
            }
        </div>
    </div>
</mat-toolbar>

<mat-dialog-content class="tw:overflow-x-hidden!">
    <p class="tw:text-sm! tw:wrap-break-word">
        {{ data.messageKey | transloco: data.params }}
    </p>
</mat-dialog-content>

<mat-dialog-actions align="end" class="tw:gap-2">
    <button
        mat-button
        type="button"
        (click)="close(false)"
    >
        {{
            (data.cancelLabelKey ?? 'GL.COMMON.CANCEL')
                | transloco: data.params
        }}
    </button>

    <button
        mat-flat-button
        type="button"
        [class]="data.danger ? 'tw:bg-error! tw:text-on-error!' : ''"
        (click)="close(true)"
    >
        {{ data.confirmLabelKey | transloco: data.params }}
    </button>
</mat-dialog-actions>
