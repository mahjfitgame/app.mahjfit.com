<main class="bfw-safe-area-p">
    <div class="tw:min-h-screen tw:flex tw:items-center tw:justify-center tw:px-4">
        <div class="tw:w-full tw:max-w-md tw:text-center">
            <div class="tw:mb-8">
                <div class="tw:mb-4 tw:flex tw:justify-center">
                    <div class="tw:overflow-hidden">
                        <img src="{{ brandLogoSrc }}" alt="Brand logo" class="tw:h-12 tw:w-auto md:tw:h-20" />
                    </div>
                </div>

                <h1 class="tw:text-3xl tw:font-bold tw:text-primary">{{ 'HOME.HEADING' | transloco }}</h1>
                <!-- <p class="tw:mt-2 tw:text-base tw:text-secondary">
                    {{ 'HOME.SUBHEADING' | transloco }}
                </p>
                <h1>{{ 'HOME.DB_VERSION' | transloco: { version: dbVersion() } }}</h1> -->
            </div>

            <h4>This is Temporary navigation for testing purpose</h4>
            <div class="tw:flex tw:flex-col tw:gap-4 tw:mb-8">
                @for (action of service.navigationActions; track action.routerLink.join('/')) {
                <a [routerLink]="action.routerLink" matButton="filled"
                    class="tw:w-full tw:justify-start tw:rounded-full">
                    <mat-icon class="material-symbols-rounded tw:me-2">{{ action.icon }}</mat-icon>
                    <span>{{ action.label | transloco }}</span>
                </a>
                }
            </div>

            <!-- <app-theme></app-theme>
            <app-internationalization></app-internationalization> -->
        </div>
    </div>
</main>
