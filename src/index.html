<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Bfw Angular PWA</title>
    <base href="/" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <!-- prevent Cross-Site Scripting (XSS) attacks. THIS NEED TO UPDATE IN PRODUCTION -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 
          'self' capacitor://localhost 
          http://localhost https://localhost 
          http://localhost:* https://localhost 
          http://0.0.0.0:* https://0.0.0.0:* 
          http://192.168.0.200:* https://192.168.0.200:* 
          http://192.168.0.230:* https://192.168.0.230:* 
          http://192.168.0.231:* https://192.168.0.231:*;
        script-src 
          'self' 
          'unsafe-inline' 
          'wasm-unsafe-eval'
          capacitor://localhost 
          http://localhost https://localhost 
          http://localhost:* https://localhost:* 
          http://0.0.0.0:* https://0.0.0.0:* 
          http://192.168.0.200:* https://192.168.0.200:* 
          http://192.168.0.230:* https://192.168.0.230:*
          http://192.168.0.231:* https://192.168.0.231:*;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com data:;
        img-src 'self' data: blob: 
          capacitor://localhost 
          http://localhost https://localhost 
          http://localhost:* https://localhost:* 
          http://0.0.0.0:* https://localhost:* 
          http://192.168.0.200:* https://192.168.0.200:* 
          http://192.168.0.230:* https://192.168.0.230:* 
          http://192.168.0.231:* https://192.168.0.230:*;
        connect-src 
          'self'
          capacitor://localhost
          http://localhost https://localhost 
          http://localhost:* https://localhost:* 
          http://0.0.0.0:* https://0.0.0.0:* 
          http://192.168.0.200:* https://192.168.0.200:* 
          http://192.168.0.230:* https://192.168.0.230:* 
          http://192.168.0.231:* https://192.168.0.231:*
          ws: wss:
          https://bfw-nestjs-microservice-api.thatsend.app
          https://bfw-nestjs-microservice-ws.thatsend.app
          https://www.google.com;
        child-src 'self' blob:;
        object-src 'none';
      "
    />
    <meta
      http-equiv="Permissions-Policy"
      content="camera=(self), microphone=(self), geolocation=(self), accelerometer=(self), display-capture=(self)"
    />

    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" />
    
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body class="bfw-field-rounded" data-bfw-theme="default" data-bfw-theme-mode="light" data-bfw-theme-preference="system">
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
