  <script>
    // Safari/iOS ReferenceError: Can't find variable: Atomics fallback
    // We polyfill Atomics so that `coincident` and `sqlite3` parsers don't crash on load,
    // but we leave SharedArrayBuffer undefined so OPFS correctly detects it is not supported.
    if (typeof Atomics === 'undefined') {
      window.Atomics = {
        notify: function() {},
        wait: function() { return 'timed-out'; },
        waitAsync: function() { return { async: false, value: Promise.resolve('timed-out') }; },
        load: function() { return 0; },
        store: function() {},
        add: function() {},
        sub: function() {},
        and: function() {},
        or: function() {},
        xor: function() {},
        exchange: function() {},
        compareExchange: function() {},
        isLockFree: function() { return false; }
      };
    }
  </script>

<!--
    data-bfw-theme-mode is intentionally not set here. the script below sets it before the first
    paint, and when it finds nothing the body inherits "color-scheme: light dark" from html,
    so the empty page still follows the system preference instead of being pinned to light.
  -->

<body class="bfw-field-rounded" data-bfw-theme="default" data-bfw-theme-preference="system">
  <!--
      this runs before the angular bundle is downloaded, the only moment early enough to stop the
      page painting in the wrong theme. the app initializer in base/theme/provider.ts owns the
      mode from bootstrap onward, this only covers the gap before that.
    -->
  <script>
    (function () {
      // storage key of the plain themeMode signal of the theme state, built as:
      // <preferences prefix>.<platform>.<signal state prefix>.<store key>.<field>
      // example: als.web.ss.theme.tmode
      //
      // on native, capacitor injects its bridge at document start, so the platform is already
      // readable here. on web the bridge ships inside the angular bundle and is not loaded yet,
      // and there the platform is 'web' anyway, which is why that is the fallback.
      var PREFERENCES_PREFIX = 'als';
      var SIGNAL_STATE_PREFIX = 'ss';
      var THEME_STATE_STORE_KEY = 'theme';
      var THEME_STATE_FIELD_MODE = 'tmode';

      var THEME_MODE_ATTRIBUTE = 'data-bfw-theme-mode';
      var THEME_MODE_DARK = 'dark';
      var THEME_MODE_LIGHT = 'light';

      try {
        var capacitor = window.Capacitor;
        var platform = capacitor && capacitor.getPlatform ? capacitor.getPlatform() : 'web';

        var storageKey = [
          PREFERENCES_PREFIX,
          platform,
          SIGNAL_STATE_PREFIX,
          THEME_STATE_STORE_KEY,
          THEME_STATE_FIELD_MODE,
        ].join('.');

        var mode = window.localStorage.getItem(storageKey);

        // no stored mode leaves the attribute off, so html color-scheme follows the system
        if (mode === THEME_MODE_DARK || mode === THEME_MODE_LIGHT) {
          document.body.setAttribute(THEME_MODE_ATTRIBUTE, mode);
        }
      } catch (e) { }
    })();
  </script>

</body>
